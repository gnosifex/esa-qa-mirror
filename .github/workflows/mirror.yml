name: mirror

on:
  schedule:
    # Daily main run (all authorities) — the run is idempotent, and a daily
    # delta caps worst-case latency at ~1 day. GitHub starts scheduled runs
    # late (observed: up to ~6h), so the actual time of day varies anyway.
    - cron: "17 22 * * *"
    # Retry runs at other times of day: they repeat only the authorities whose
    # latest run failed (qa_mirror.retry_plan) and do nothing otherwise — so a
    # temporarily failing source (e.g. ESMA's 403s on 2026-10-23..29) is
    # retried the same day instead of waiting for the next main run.
    - cron: "43 5 * * *"
    - cron: "43 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Never two mirror runs at once (manual dispatch vs cron) — they would race
# on the state.json/data commit.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # a full CRR-scale first run needs ~1h; generous headroom
    outputs:
      ran: ${{ steps.plan.outputs.authorities != '' }}
    steps:
      # Pinned to full commit SHAs (repo setting "Require actions to be pinned
      # to a full-length commit SHA"). Update SHAs deliberately when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # branch tip, not the event-time snapshot: schedule runs are pinned
          # to the commit at trigger time, so a delayed cron would execute
          # outdated code and rebase its state commit onto a stale base
          # (seen live 2026-07-10: a 3h-late cron ran pre-fix code and its
          # commit step failed on the rebase)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Which authorities this run covers: all of them on the daily main run and
      # on manual dispatch; on a retry run only those whose latest run failed.
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "17 22 * * *" ]; then
            auths="$(python -m qa_mirror.retry_plan runs.jsonl)"
          else
            auths="esma eiopa eba"
          fi
          echo "authorities: ${auths:-none (nothing to retry)}"
          echo "authorities=$auths" >> "$GITHUB_OUTPUT"
      # One step per authority, so a failing source shows up by name and never
      # holds back the others. Sequential on purpose: all three share
      # state.json. Partial failures must not lose the successful part: each
      # mirror step is decoupled from the commit step and its outcome re-raised
      # at the end, so the run still commits what it got but ends red on any
      # error. ESMA first — it is the one being probed at varying times of day.
      - name: Mirror ESMA
        id: esma
        if: contains(steps.plan.outputs.authorities, 'esma')
        continue-on-error: true
        run: python -m qa_mirror --authority esma
      - name: Mirror EIOPA
        id: eiopa
        if: contains(steps.plan.outputs.authorities, 'eiopa')
        continue-on-error: true
        run: python -m qa_mirror --authority eiopa
      - name: Mirror EBA
        id: eba
        if: contains(steps.plan.outputs.authorities, 'eba')
        continue-on-error: true
        run: python -m qa_mirror --authority eba
      - name: Commit changes
        if: steps.plan.outputs.authorities != ''
        env:
          AUTHS: ${{ steps.plan.outputs.authorities }}
        run: |
          git config user.name "esa-qa-mirror bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state.json runs.jsonl
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "mirror: $(date -u +%F) delta (${AUTHS// /, })"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Fail on mirror errors
        if: >-
          steps.esma.outcome == 'failure' || steps.eiopa.outcome == 'failure'
          || steps.eba.outcome == 'failure'
        env:
          ESMA: ${{ steps.esma.outcome }}
          EIOPA: ${{ steps.eiopa.outcome }}
          EBA: ${{ steps.eba.outcome }}
        run: |
          echo "mirror run reported errors — ESMA: $ESMA, EIOPA: $EIOPA, EBA: $EBA"
          echo "see the failing Mirror step's log and the job summary"
          exit 1

  # Rebuild + deploy the search site from the (possibly partial) fresh data.
  # Runs even when the mirror job ended red — partial results are committed
  # and the site should reflect them. Skipped when a retry run had nothing
  # to retry.
  deploy:
    needs: mirror
    if: ${{ !cancelled() && needs.mirror.outputs.ran == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
